# Conda environment for the CS224W enhancer-gene random-walk / SSM project.
#
# macOS (dev):        mamba env create -f environment.yml
# Linux GPU cluster:  CONDA_OVERRIDE_CUDA=12.6 mamba env create -f environment.yml
#                     (login nodes have no GPU; the override makes conda pick the CUDA build of pytorch)
# then:               conda activate e2g
#                     python -m ipykernel install --user --name e2g --display-name "Python (e2g)"
#
# GPU-only extras (Mamba CUDA kernels; Linux + CUDA only). Optional: the notebook falls back
# to a plain-PyTorch selective scan without them.
#   pip install -r requirements-cuda.txt --no-build-isolation
#
# pytorch comes from conda-forge (not pip) so it shares one OpenMP runtime with numpy/scikit-learn;
# mixing pip torch with conda numpy segfaults on macOS.
name: e2g
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - pip
  # core scientific stack
  - numpy>=1.26,<2.3
  - pandas>=2.2
  - scipy>=1.12
  - scikit-learn>=1.4
  - pyarrow>=15          # parquet for processed tables
  - matplotlib>=3.8
  - tqdm
  - requests
  - pytorch>=2.3
  # notebook
  - jupyterlab
  - ipykernel
  - nbconvert
  # genomics I/O
  - pysam>=0.22          # BAM read counting (ATAC activity)
  - pyfaidx>=0.8         # indexed access to the GRCh38 FASTA
  - samtools>=1.19       # BAM indexing in download_data.sh
  - pip:
      - torch_geometric>=2.5
      - pyranges>=0.1,<0.2      # interval joins on DataFrames
      - hic-straw>=1.3.1        # streams remote .hic files (no 34 GB download)
      - transformers>=4.40,<5   # HyenaDNA remote code targets transformers 4.x
